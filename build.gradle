plugins {
    id 'java'
    id 'application'
    id 'eclipse'
}

group = 'in.simplifymoney'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    // The main source set compiles against the JDK alone. The H2 driver is
    // loaded reflectively by java.sql.DriverManager at run time, so it is a
    // runtime dependency only. Add whatever you need for your document store.
    runtimeOnly 'com.h2database:h2:2.2.224'
    implementation 'org.mongodb:mongodb-driver-sync:5.3.1'

    testImplementation 'org.mongodb:mongodb-driver-sync:5.3.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers:1.20.4'
    testImplementation 'org.testcontainers:mongodb:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into 'lib'
}

application {
    mainClass = 'in.simplifymoney.ledgersync.App'
}

test { useJUnitPlatform() }

// Dependency-free smoke run. Works with no network and no database.
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    mainClass = 'in.simplifymoney.ledgersync.SelfCheck'
    classpath = sourceSets.main.runtimeClasspath
}
